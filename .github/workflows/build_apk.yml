name: Build Grocery APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Clean Flutter Project
        run: |
          mkdir -p temp_app
          flutter create --org com.quickmart.grocery --project-name quick_mart temp_app
          cp -r temp_app/android ./android
          cp -r temp_app/ios ./ios || true
          rm -rf temp_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Grocery APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickMart-Grocery-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
